name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  jadslink-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jadslink-app/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r jadslink-app/requirements.txt
          pip install pytest httpx

      - name: Correr tests
        run: python -m pytest jadslink-app/tests -v
